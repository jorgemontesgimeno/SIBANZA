name: Run Daily ETL

on:
  schedule:
    # 05:00 UTC equivale a las 07:00 AM en España (Horario de Verano)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permite ejecutar el script manualmente desde la web de GitHub

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance sqlalchemy psycopg2-binary python-dotenv

    - name: Ejecutar script ETL
      # Entra exactamente en la carpeta donde está tu archivo .py
      working-directory: ./1_databases/1_data_extraction
      env:
        user: ${{ secrets.USER }}       # <-- Cambiado de DB_USER a USER
        password: ${{ secrets.PASSWORD }} # <-- Cambiado de DB_PASSWORD a PASSWORD
        host: ${{ secrets.HOST }}       # <-- Cambiado de DB_HOST a HOST
        port: ${{ secrets.PORT }}       # <-- Cambiado de DB_PORT a PORT
        dbname: ${{ secrets.DBNAME }}   # <-- Cambiado de DB_NAME a DBNAME
      # Ejecuta tu script con su nombre real
      run: python daily_price_update.py

name: Run Daily ETL

on:
  schedule:
    # 08:00 UTC equivale a las 10:00 AM en España (Horario de Verano)
    - cron: '0 17 * * *'
  workflow_dispatch: # Permite ejecutar el script manualmente desde la web de GitHub

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance sqlalchemy psycopg2-binary python-dotenv

    - name: Ejecutar script ETL
      # Entra exactamente en la carpeta donde está tu archivo .py
      working-directory: ./1_databases/1_data_extraction
      env:
        user: ${{ secrets.DB_USER }}
        password: ${{ secrets.DB_PASSWORD }}
        host: ${{ secrets.DB_HOST }}
        port: ${{ secrets.DB_PORT }}
        dbname: ${{ secrets.DB_NAME }}
      # Ejecuta tu script con su nombre real
      run: python daily_price_update.py
